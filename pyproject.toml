[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reposift"
version = "0.1.0"
description = "A high-performance repository context aggregator for LLMs."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    { name = "Developer", email = "dev@example.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "rich>=13.0.0",
    "tiktoken>=0.5.0",
    "pathspec>=0.11.0",
    "pyperclip>=1.8.2"
]

[project.scripts]
reposift = "reposift.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0"
]
